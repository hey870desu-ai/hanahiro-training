<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>勤務形態一覧表｜株式会社はなひろ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --ink: #1f2933;
      --ink-soft: #3a414d;
      --ink-mute: #5d6068;
      --gold: #a87827;
      --gold-soft: #d6b072;
      --gold-pale: #f4ead6;
      --paper: #fbf9f4;
      --line: #e3dccc;
      --line-soft: #f0eadb;
      --weekend: #fff4ec;
    }
    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', sans-serif;
      color: var(--ink); background: var(--paper);
      line-height: 1.6; font-size: 14px;
      -webkit-font-smoothing: antialiased;
      padding: 0 0 60px;
    }

    /* パスワードゲート */
    .auth-overlay {
      position: fixed; inset: 0;
      background: rgba(31,41,51,0.92); z-index: 1000;
      display: flex; align-items: center; justify-content: center;
    }
    .auth-modal {
      background: #fff; padding: 36px 32px; border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 400px; width: 90%;
      text-align: center;
    }
    .auth-modal h2 {
      font-family: 'Noto Serif JP', serif; font-size: 18px; color: var(--ink);
      margin-bottom: 8px;
    }
    .auth-modal p { font-size: 13px; color: var(--ink-soft); margin-bottom: 20px; }
    .auth-modal input {
      width: 100%; padding: 10px 12px; border: 1px solid var(--line);
      font-size: 16px; border-radius: 4px; text-align: center;
      letter-spacing: 0.1em;
    }
    .auth-modal input:focus { outline: 2px solid var(--gold); border-color: var(--gold); }
    .auth-modal button {
      margin-top: 16px; padding: 10px 28px;
      background: var(--ink); color: #fff; border: none;
      border-radius: 22px; font-size: 14px; font-weight: 600; cursor: pointer;
      letter-spacing: 0.05em;
    }
    .auth-modal button:hover { background: var(--gold); }
    .auth-modal .err { color: #c0392b; font-size: 12px; margin-top: 8px; min-height: 16px; }

    /* topbar */
    .topbar {
      background: #fff; border-bottom: 1px solid var(--line);
      padding: 14px 20px;
      position: sticky; top: 0; z-index: 50;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 10px;
    }
    .topbar .crumb {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px; letter-spacing: 0.15em; color: var(--ink-soft);
      text-transform: uppercase;
    }
    .topbar a, .topbar button {
      color: var(--ink-soft); text-decoration: none;
      font-size: 13px; font-weight: 500;
      background: transparent; border: 1px solid var(--line);
      padding: 6px 14px; border-radius: 22px; cursor: pointer;
      transition: all 0.2s;
    }
    .topbar button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
    .topbar button:hover { background: var(--ink); color: #fff; border-color: var(--ink); }

    .container { max-width: 1700px; margin: 0 auto; padding: 24px 16px; }

    /* タイトル */
    .doc-head { text-align: center; padding: 12px 0 18px; }
    .doc-eyebrow {
      font-family: 'Cormorant Garamond', serif; font-size: 10pt;
      letter-spacing: 0.4em; color: var(--gold); margin-bottom: 4px;
    }
    .doc-title {
      font-family: 'Noto Serif JP', serif; font-size: 22px;
      font-weight: 600; color: var(--ink);
    }

    /* 事業所タブ */
    .facility-tabs {
      display: flex; gap: 6px; margin-bottom: 8px;
      border-bottom: 2px solid var(--ink); padding: 0 4px;
      flex-wrap: wrap; align-items: center;
    }
    .facility-tab {
      background: #fff; border: 1px solid var(--line); border-bottom: none;
      padding: 9px 18px; font-family: 'Noto Serif JP', serif;
      font-size: 13px; font-weight: 600; color: var(--ink-soft);
      cursor: pointer; border-radius: 8px 8px 0 0;
      position: relative; bottom: -2px;
      transition: all 0.15s;
    }
    .facility-tab:hover { color: var(--ink); }
    .facility-tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }

    /* 事業所情報 */
    .facility-info {
      background: #fff; border: 1px solid var(--line);
      padding: 14px 18px; margin-bottom: 18px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px;
      font-size: 12.5px;
    }
    .facility-info .row { display: flex; gap: 8px; }
    .facility-info .lbl {
      color: var(--gold); font-weight: 600; min-width: 100px;
      font-family: 'Noto Serif JP', serif;
    }

    /* 単位タブ */
    .unit-tabs {
      display: flex; gap: 4px; margin-bottom: 8px;
      border-bottom: 2px solid var(--gold); padding: 0 4px;
      align-items: center;
    }
    .unit-tab {
      background: #fff; border: 1px solid var(--line); border-bottom: none;
      padding: 9px 22px; font-family: 'Noto Serif JP', serif;
      font-size: 13px; font-weight: 600; color: var(--ink-soft);
      cursor: pointer; border-radius: 8px 8px 0 0;
      position: relative; bottom: -2px; transition: all 0.15s;
    }
    .unit-tab:hover { color: var(--ink); }
    .unit-tab.active { background: var(--gold); color: #fff; border-color: var(--gold); }

    /* 月選択 */
    .month-selector {
      background: #fff; border: 1px solid var(--line);
      padding: 12px 20px; margin-bottom: 18px;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .month-selector select {
      font-family: inherit; font-size: 14px; padding: 6px 10px;
      border: 1px solid var(--line); border-radius: 4px;
      background: #fff; color: var(--ink);
    }
    .month-selector .label { font-family: 'Noto Serif JP', serif; font-weight: 600; color: var(--ink); }
    .month-selector button {
      background: transparent; border: 1px solid var(--line);
      padding: 5px 12px; border-radius: 18px; font-size: 13px;
      cursor: pointer; color: var(--ink-soft);
    }
    .month-selector button:hover { background: var(--ink); color: #fff; }

    /* セクション */
    .section { background: #fff; border: 1px solid var(--line); margin-bottom: 24px; }
    .section-head {
      padding: 14px 20px; background: var(--ink); color: #fff;
      display: flex; justify-content: space-between; align-items: center;
      font-family: 'Noto Serif JP', serif; font-size: 15px; font-weight: 600;
    }
    .section-head .actions { display: flex; gap: 8px; }
    .section-head .actions button {
      background: transparent; border: 1px solid var(--gold-soft);
      color: var(--gold-soft); padding: 4px 12px; border-radius: 16px;
      font-size: 12px; cursor: pointer;
    }
    .section-head .actions button:hover { background: var(--gold); color: #fff; border-color: var(--gold); }
    .section-body { padding: 16px 20px; }

    /* シフトパターン管理 */
    details { margin-bottom: 24px; }
    summary {
      cursor: pointer; padding: 14px 20px;
      background: #fff; border: 1px solid var(--line);
      font-family: 'Noto Serif JP', serif; font-weight: 600;
      list-style: none;
      display: flex; align-items: center; gap: 8px;
    }
    summary::before {
      content: "▶"; font-size: 10px; color: var(--gold);
      transition: transform 0.2s;
    }
    details[open] summary::before { transform: rotate(90deg); }

    .pattern-table {
      width: 100%; border-collapse: collapse;
      font-size: 13px; margin-top: 12px;
    }
    .pattern-table th {
      background: var(--ink); color: #fff;
      padding: 8px; font-weight: 600; font-size: 12px;
      letter-spacing: 0.04em; text-align: center;
    }
    .pattern-table td { padding: 0; border: 1px solid var(--line-soft); }
    .pattern-table input {
      width: 100%; padding: 6px 8px; border: none;
      font-family: inherit; font-size: 13px; background: transparent;
      text-align: center;
    }
    .pattern-table input:focus { background: var(--gold-pale); outline: 1px solid var(--gold); }
    .pattern-table input.name { text-align: left; }
    .pattern-table input.note { text-align: left; }
    .pattern-table .del-btn {
      background: transparent; border: none;
      color: var(--ink-mute); cursor: pointer;
      font-size: 16px; padding: 4px 8px;
    }
    .pattern-table .del-btn:hover { color: #c0392b; }
    .add-row-btn {
      margin-top: 10px;
      background: transparent; border: 1px dashed var(--gold);
      color: var(--gold); padding: 6px 16px; cursor: pointer;
      font-size: 13px; border-radius: 4px;
    }
    .add-row-btn:hover { background: var(--gold-pale); }

    /* シフト一覧表 */
    .shift-table-wrap {
      overflow-x: auto; background: #fff; border: 1px solid var(--line);
    }
    .shift-table { border-collapse: collapse; font-size: 12px; min-width: 100%; }
    .shift-table th, .shift-table td {
      border: 1px solid var(--line-soft); padding: 0; text-align: center;
    }
    .shift-table thead th {
      background: var(--ink); color: #fff;
      padding: 6px 4px; font-weight: 600; font-size: 11px;
      position: sticky; top: 0; z-index: 10;
    }
    .shift-table thead .day-header { min-width: 38px; width: 38px; }
    .shift-table thead .day-sat { background: #2c4159; }
    .shift-table thead .day-sun { background: #5a3338; }
    .shift-table tbody td.weekend { background: var(--weekend); }
    .shift-table tbody td.week-end-divider { border-right: 2px solid var(--gold-soft); }
    .shift-table tbody td.staff-info input,
    .shift-table tbody td.staff-info select {
      width: 100%; padding: 6px 8px; border: none;
      background: transparent; font-family: inherit; font-size: 12px;
    }
    .shift-table tbody td.staff-info input:focus,
    .shift-table tbody td.staff-info select:focus {
      background: var(--gold-pale); outline: 1px solid var(--gold);
    }
    .shift-table tbody td.shift-cell select {
      width: 100%; padding: 4px 2px; border: none;
      background: transparent; font-family: inherit; font-size: 11px;
      text-align: center; text-align-last: center;
      cursor: pointer; appearance: none; -webkit-appearance: none;
    }
    .shift-table tbody td.shift-cell select:focus {
      background: var(--gold-pale); outline: 1px solid var(--gold);
    }
    .shift-table tbody td.summary {
      background: var(--gold-pale); font-weight: 600;
      padding: 6px 8px; min-width: 60px;
    }
    .shift-table tbody td.note input {
      width: 100%; padding: 6px 8px; border: none; background: transparent;
      font-family: inherit; font-size: 12px;
    }
    .shift-table .row-num { color: var(--ink-mute); width: 30px; padding: 6px; }
    .shift-table .del-row-btn {
      background: transparent; border: none;
      color: var(--ink-mute); cursor: pointer; font-size: 14px;
    }
    .shift-table .del-row-btn:hover { color: #c0392b; }
    .shift-table tfoot td {
      background: var(--gold-pale); font-weight: 700;
      padding: 6px 4px; font-size: 11px; color: var(--ink);
    }

    /* バックアップ */
    .actions-bar {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
      padding: 16px 20px; background: var(--gold-pale);
      border: 1px solid var(--gold-soft); margin-top: 24px;
    }
    .actions-bar button {
      background: var(--ink); color: #fff;
      border: none; padding: 8px 18px;
      border-radius: 22px; font-size: 13px; cursor: pointer; font-weight: 500;
    }
    .actions-bar button.secondary {
      background: #fff; color: var(--ink); border: 1px solid var(--ink);
    }
    .actions-bar button:hover { opacity: 0.85; }
    .save-status {
      margin-left: auto; font-size: 12px; color: var(--ink-soft);
      font-style: italic;
    }
    .save-status.synced { color: #27ae60; }
    .save-status.saving { color: var(--gold); }
    .save-status.error { color: #c0392b; }

    /* 印刷 */
    @page { size: A3 landscape; margin: 8mm; }
    @media print {
      .topbar, .actions-bar, details, .month-selector button, .facility-tabs { display: none !important; }
      body { background: #fff; padding: 0; font-size: 9pt; }
      .container { padding: 0; max-width: 100%; }
      .doc-head { padding: 4mm 0; }
      .doc-title { font-size: 18pt; }
      .facility-info { font-size: 9pt; padding: 8px 12px; }
      .month-selector { padding: 6px 12px; font-size: 9pt; }
      .month-selector select { border: none; padding: 0; font-size: 11pt; font-weight: bold; color: var(--ink); }
      .section-head { padding: 6px 10px; font-size: 11pt; }
      .shift-table { font-size: 9pt; }
      .shift-table thead th { padding: 4px 2px; font-size: 9pt; position: static; }
      .shift-table tbody td.shift-cell select { font-size: 10pt; -webkit-appearance: none; appearance: none; }
      .shift-table tfoot td { font-size: 9pt; }
      select { background: transparent !important; }
      .del-row-btn, .del-btn, .add-row-btn { display: none !important; }
    }
  </style>
</head>

<!-- パスワードゲート -->
<div id="auth-overlay" class="auth-overlay">
  <div class="auth-modal">

    <div><button onclick="checkAuth()">開く</button></div>
    <div class="err" id="auth-err"></div>
  </div>
</div>

<!-- メインアプリ（認証後表示） -->
<div id="main-app" style="display:none">

<div class="topbar">
  <a href="https://www.hana-hiro.com/">&#x2190; ホームへ</a>
  <span class="crumb">勤務形態一覧表</span>
  <div style="display:flex;gap:8px">
    <button onclick="window.print()">PRINT / PDF</button>
    <button class="primary" onclick="exportXlsx()">Excel書き出し</button>
  </div>
</div>

<div class="container">

  <div class="doc-head">
    <div class="doc-eyebrow">SHIFT SCHEDULE</div>
    <h1 class="doc-title">勤務形態一覧表</h1>
  </div>

  <!-- 事業所タブ -->
  <div class="facility-tabs" id="facility-tabs"></div>

  <!-- 事業所情報 -->
  <div class="facility-info" id="facility-info"></div>

  <!-- 単位タブ -->
  <div class="unit-tabs" id="unit-tabs"></div>

  <!-- 月選択 -->
  <div class="month-selector">
    <span class="label">基準年月：</span>
    <select id="year"></select>
    <span>年</span>
    <select id="month"></select>
    <span>月</span>
    <button onclick="changeMonth(-1)">＜ 先月</button>
    <button onclick="changeMonth(1)">来月 ＞</button>
    <span style="margin-left:auto;font-size:12px;color:var(--ink-mute)" id="day-info"></span>
  </div>

  <!-- シフトパターン管理 -->
  <details>
    <summary>シフトパターン管理（クリックで開閉／事業所ごとに独立）</summary>
    <div style="padding:0 16px 16px;background:#fff;border:1px solid var(--line);border-top:none">
      <table class="pattern-table">
        <thead>
          <tr>
            <th style="width:60px">コード</th>
            <th>シフト名</th>
            <th style="width:80px">開始</th>
            <th style="width:80px">終了</th>
            <th style="width:60px">休憩</th>
            <th style="width:80px">実働(h)</th>
            <th>備考</th>
            <th style="width:40px"></th>
          </tr>
        </thead>
        <tbody id="pattern-tbody"></tbody>
      </table>
      <button class="add-row-btn" onclick="addPattern()">+ シフトパターンを追加</button>
    </div>
  </details>

  <!-- シフト一覧表 -->
  <div class="section">
    <div class="section-head">
      <span>勤務形態一覧</span>
      <div class="actions">
        <button onclick="addStaff()">+ 職員追加</button>
      </div>
    </div>
    <div class="shift-table-wrap">
      <table class="shift-table" id="shift-table">
        <thead id="shift-thead"></thead>
        <tbody id="shift-tbody"></tbody>
        <tfoot id="shift-tfoot"></tfoot>
      </table>
    </div>
  </div>

  <!-- バックアップ -->
  <div class="actions-bar">
    <button onclick="exportXlsx()">📊 Excel書き出し</button>
    <button class="secondary" onclick="exportJson()">💾 JSONバックアップ</button>
    <button class="secondary" onclick="document.getElementById('json-import').click()">📥 JSON読み込み</button>
    <input type="file" id="json-import" accept=".json" style="display:none" onchange="importJson(event)">
    <span class="save-status" id="save-status">─</span>
  </div>

</div>

</div><!-- /main-app -->

const DEFAULT_STAFF = [

];

const DAY_LABELS = ['日','月','火','水','木','金','土'];

function makeDefaultFacilityState(facility) {
  const data = {};
  for (const u of facility.units) {
    data[u] = { staff: JSON.parse(JSON.stringify(DEFAULT_STAFF)), schedule: {} };
  }
  return {
    info: facility.info,
    patterns: JSON.parse(JSON.stringify(DEFAULT_PATTERNS)),
    units: facility.units,
    currentUnit: facility.units[0],
    year: 2026,
    month: 6,
    data,
    updatedAt: 0,
  };
}

let state = {
  currentFacility: 'asaka',
  facilities: {},
};

// 各事業所の最終ローカル保存タイムスタンプ（自分のechoを判定）
const lastLocalSave = {};
const saveTimers = {};
const subscriptions = {};

// ===== ユーティリティ =====
function escape(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function curFacility() { return state.facilities[state.currentFacility]; }
function curUnit() { return state.currentFacility ? curFacility().currentUnit : null; }
function curStaff() { return curFacility().data[curUnit()].staff; }
function curSchedule() { return curFacility().data[curUnit()].schedule; }
function monthKey() { const f = curFacility(); return `${f.year}-${String(f.month).padStart(2,'0')}`; }
function getSchedule(staffIdx, day) {
  const sch = curSchedule(); const k = monthKey();
  return (sch[k] && sch[k][staffIdx] && sch[k][staffIdx][day]) || '';
}
function setSchedule(staffIdx, day, value) {
  const sch = curSchedule(); const k = monthKey();
  if (!sch[k]) sch[k] = {};
  if (!sch[k][staffIdx]) sch[k][staffIdx] = {};
  sch[k][staffIdx][day] = value;
}
function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
function getDayOfWeek(y, m, d) { return new Date(y, m - 1, d).getDay(); }

window.checkAuth = function() {

};

// ===== Firebase 同期 =====
function setStatus(text, cls) {
  const el = document.getElementById('save-status');
  el.textContent = text;
  el.className = 'save-status' + (cls ? ' ' + cls : '');
}

async function subscribeFacility(facilityId) {
  await authReady;
  const ref = doc(db, 'shift-schedules', facilityId);
  if (subscriptions[facilityId]) return; // 既に購読中
  subscriptions[facilityId] = onSnapshot(ref, async (snapshot) => {
    if (snapshot.exists()) {
      const data = snapshot.data();
      // 自分の echo は無視（updatedAt が一致）
      if (data.updatedAt && data.updatedAt === lastLocalSave[facilityId]) return;
      // 反映
      state.facilities[facilityId] = data;
      if (state.currentFacility === facilityId) {
        renderAll();
      }
    } else {
      // ドキュメントが無い → デフォルトで初期化してアップロード
      const facility = FACILITIES.find(f => f.id === facilityId);
      state.facilities[facilityId] = makeDefaultFacilityState(facility);
      await saveFacility(facilityId);
      if (state.currentFacility === facilityId) renderAll();
    }
  }, (err) => {
    console.error('subscribe error', err);
    setStatus('同期エラー: ' + err.message, 'error');
  });
}

async function saveFacility(facilityId) {
  await authReady;
  setStatus('保存中…', 'saving');
  const stamp = Date.now();
  state.facilities[facilityId].updatedAt = stamp;
  lastLocalSave[facilityId] = stamp;
  try {
    await setDoc(doc(db, 'shift-schedules', facilityId), state.facilities[facilityId]);
    setStatus('クラウド同期済み: ' + new Date().toLocaleTimeString('ja-JP'), 'synced');
  } catch (err) {
    console.error('save error', err);
    setStatus('保存失敗: ' + err.message, 'error');
  }
}

function scheduleSave() {
  const fid = state.currentFacility;
  if (!fid) return;
  if (saveTimers[fid]) clearTimeout(saveTimers[fid]);
  saveTimers[fid] = setTimeout(() => saveFacility(fid), 800);
  setStatus('変更あり…', 'saving');
}

// ===== 旧localStorage（v1）からのマイグレーション =====
const LEGACY_KEY = 'hanahiro-shift-schedule';
async function tryMigrateLegacy() {
  const raw = localStorage.getItem(LEGACY_KEY);
  if (!raw) return false;
  try {
    const obj = JSON.parse(raw);
    // v1旧形式：{ year, month, patterns, staff, schedule } または { year, month, patterns, units: {...} }
    let hasData = false;
    let asakaData = null;
    if (obj.units && (obj.units['午前の部'] || obj.units['午後の部'])) {
      hasData = true;
      asakaData = {
        info: FACILITIES.find(f => f.id === 'asaka').info,
        patterns: obj.patterns || JSON.parse(JSON.stringify(DEFAULT_PATTERNS)),
        units: ['午前の部', '午後の部'],
        currentUnit: obj.currentUnit || '午前の部',
        year: obj.year || 2026,
        month: obj.month || 6,
        data: obj.units,
        updatedAt: 0,
      };
    } else if (obj.staff) {
      hasData = true;
      asakaData = makeDefaultFacilityState(FACILITIES.find(f => f.id === 'asaka'));
      asakaData.patterns = obj.patterns || asakaData.patterns;
      asakaData.year = obj.year || asakaData.year;
      asakaData.month = obj.month || asakaData.month;
      asakaData.data['午前の部'] = { staff: obj.staff, schedule: obj.schedule || {} };
    }
    if (!hasData) return false;

    const ok = confirm('古いバージョンのデータがブラウザに残っています。\n「poem de riha 安積店」のデータとしてクラウドに取り込みますか？\n\n（取り込み後、旧データはローカルから削除されます。\nキャンセルすると現在のクラウドデータが優先されます）');
    if (!ok) return false;

    // クラウドにアップロード
    state.facilities['asaka'] = asakaData;
    await saveFacility('asaka');
    localStorage.removeItem(LEGACY_KEY);
    alert('旧データを「poem de riha 安積店」に取り込みました。');
    return true;
  } catch (e) {
    console.error('legacy migration', e);
    return false;
  }
}

// ===== 初期化 =====
async function initApp() {
  setStatus('クラウドに接続中…', 'saving');
  await authReady;

  // 4事業所の購読を開始（最初は空のstateを用意）
  for (const f of FACILITIES) {
    if (!state.facilities[f.id]) state.facilities[f.id] = makeDefaultFacilityState(f);
  }
  for (const f of FACILITIES) {
    await subscribeFacility(f.id);
  }

  // 旧localStorage データがあれば取り込み確認
  await tryMigrateLegacy();

  buildFacilityTabs();
  buildMonthSelector();
  renderAll();
  setStatus('準備完了', 'synced');
}

function switchFacility(fid) {

function switchUnit(unit) {

// ===== 月選択 =====
function buildMonthSelector() {
  const yearSel = document.getElementById('year');
  const monthSel = document.getElementById('month');
  const currentYear = new Date().getFullYear();
  yearSel.innerHTML = '';
  for (let y = currentYear - 1; y <= currentYear + 3; y++) {
    const opt = document.createElement('option');
    opt.value = y; opt.textContent = y;
    yearSel.appendChild(opt);
  }
  monthSel.innerHTML = '';
  for (let m = 1; m <= 12; m++) {
    const opt = document.createElement('option');
    opt.value = m; opt.textContent = m;
    monthSel.appendChild(opt);
  }
  yearSel.addEventListener('change', () => { curFacility().year = parseInt(yearSel.value); scheduleSave(); renderShiftTable(); });
  monthSel.addEventListener('change', () => { curFacility().month = parseInt(monthSel.value); scheduleSave(); renderShiftTable(); });
}
window.changeMonth = function(delta) {
  const f = curFacility();
  f.month += delta;
  if (f.month > 12) { f.month = 1; f.year += 1; }
  if (f.month < 1) { f.month = 12; f.year -= 1; }
  document.getElementById('year').value = f.year;
  document.getElementById('month').value = f.month;
  scheduleSave();
  renderShiftTable();
};

// ===== シフト一覧表 =====
function buildShiftHead(days) {
  const f = curFacility();
  const thead = document.getElementById('shift-thead');
  let h1 = '<tr>';
  h1 += '<th rowspan="2" style="min-width:30px">No.</th>';
  h1 += '<th rowspan="2" style="min-width:100px">職種</th>';
  h1 += '<th rowspan="2" style="min-width:90px">雇用形態</th>';
  h1 += '<th rowspan="2" style="min-width:120px">氏名</th>';
  let weekStart = 1;
  while (weekStart <= days) {
    const weekEnd = Math.min(weekStart + 6, days);
    const span = weekEnd - weekStart + 1;
    h1 += `<th colspan="${span}" style="background:var(--gold)">${Math.floor(weekStart/7)+1}週目</th>`;
    weekStart = weekEnd + 1;
  }
  h1 += '<th rowspan="2" style="min-width:60px">月合計<br>(h)</th>';
  h1 += '<th rowspan="2" style="min-width:60px">月平均<br>(h/週)</th>';
  h1 += '<th rowspan="2" style="min-width:70px">常勤換算<br>(月/160h)</th>';
  h1 += '<th rowspan="2" style="min-width:90px">備考</th>';
  h1 += '<th rowspan="2" style="min-width:30px"></th>';
  h1 += '</tr>';

  let h2 = '<tr>';
  for (let d = 1; d <= days; d++) {
    const dow = getDayOfWeek(f.year, f.month, d);
    let dayClass = 'day-header';
    if (dow === 6) dayClass += ' day-sat';
    if (dow === 0) dayClass += ' day-sun';
    h2 += `<th class="${dayClass}">${d}<br><small>${DAY_LABELS[dow]}</small></th>`;
  }
  h2 += '</tr>';
  thead.innerHTML = h1 + h2;
}
function buildShiftTbody(days) {
  const f = curFacility();
  const tbody = document.getElementById('shift-tbody');
  tbody.innerHTML = '';
  const optionsHtml = '<option value=""></option>' +
    f.patterns.map(p => `<option value="${escape(p.code)}">${escape(p.code)}</option>`).join('');
  curStaff().forEach((s, i) => {
    const tr = document.createElement('tr');
    let html = '';
    html += `<td class="row-num">${i+1}</td>`;
    html += `<td class="staff-info col-job"><input value="${escape(s.jobTitle)}" oninput="updateStaff(${i},'jobTitle',this.value)"></td>`;
    html += `<td class="staff-info col-emp"><input value="${escape(s.employmentType)}" oninput="updateStaff(${i},'employmentType',this.value)"></td>`;
    html += `<td class="staff-info col-name"><input value="${escape(s.name)}" oninput="updateStaff(${i},'name',this.value)"></td>`;
    for (let d = 1; d <= days; d++) {
      const dow = getDayOfWeek(f.year, f.month, d);
      const isWeekEndCol = (d % 7 === 0 && d < days);
      const cls = ['shift-cell'];
      if (dow === 6 || dow === 0) cls.push('weekend');
      if (isWeekEndCol) cls.push('week-end-divider');
      const value = getSchedule(i, d);
      html += `<td class="${cls.join(' ')}">
        <select onchange="setShiftCell(${i},${d},this.value)">${optionsHtml.replace(`value="${escape(value)}"`, `value="${escape(value)}" selected`)}</select>
      </td>`;
    }
    const total = calcMonthTotal(i, days);
    html += `<td class="summary">${total.toFixed(1)}</td>`;
    html += `<td class="summary">${(total/4).toFixed(1)}</td>`;
    html += `<td class="summary">${(total/160).toFixed(2)}</td>`;
    html += `<td class="note"><input value="${escape(s.note)}" oninput="updateStaff(${i},'note',this.value)"></td>`;
    html += `<td><button class="del-row-btn" onclick="removeStaff(${i})" title="削除">×</button></td>`;
    tr.innerHTML = html;
    tbody.appendChild(tr);
  });
}
function buildShiftTfoot(days) {
  const f = curFacility();
  const tfoot = document.getElementById('shift-tfoot');
  let html = '<tr>';
  html += '<td colspan="4" style="text-align:right;padding-right:10px">合計</td>';
  for (let d = 1; d <= days; d++) {
    let dayTotal = 0;
    curStaff().forEach((_, i) => {
      const code = getSchedule(i, d);
      const p = f.patterns.find(p => p.code === code);
      if (p) dayTotal += p.hours;
    });
    html += `<td>${dayTotal > 0 ? dayTotal.toFixed(1) : '-'}</td>`;
  }
  let grandTotal = 0;
  curStaff().forEach((_, i) => grandTotal += calcMonthTotal(i, days));
  html += `<td>${grandTotal.toFixed(1)}</td>`;
  html += `<td>${(grandTotal/4).toFixed(1)}</td>`;
  html += `<td>${(grandTotal/160).toFixed(2)}</td>`;
  html += '<td colspan="2"></td>';
  html += '</tr>';
  tfoot.innerHTML = html;
}
function calcMonthTotal(staffIdx, days) {
  const f = curFacility();
  let total = 0;
  for (let d = 1; d <= days; d++) {
    const code = getSchedule(staffIdx, d);
    const p = f.patterns.find(p => p.code === code);
    if (p) total += p.hours;
  }
  return total;
}
window.setShiftCell = function(staffIdx, day, code) {
  setSchedule(staffIdx, day, code);
  scheduleSave();
  renderShiftTable();
};
window.updateStaff = function(i, key, value) {
  curStaff()[i][key] = value;
  scheduleSave();
};
window.addStaff = function() {
  curStaff().push({ jobTitle: '', employmentType: '', name: '', note: '' });
  scheduleSave(); renderShiftTable();
};
window.removeStaff = function(i) {
  if (!confirm('この職員を削除しますか？')) return;
  curStaff().splice(i, 1);
  const sch = curSchedule();
  Object.keys(sch).forEach(k => { if (sch[k][i]) delete sch[k][i]; });
  scheduleSave(); renderShiftTable();
};
function renderShiftTable() {
  const f = curFacility();
  const days = daysInMonth(f.year, f.month);
  buildShiftHead(days);
  buildShiftTbody(days);
  buildShiftTfoot(days);
  document.getElementById('day-info').textContent = `${days}日 / 1日(月初) ${DAY_LABELS[getDayOfWeek(f.year, f.month, 1)]}曜`;
}

// ===== Excel書き出し =====
window.exportXlsx = function() {
  const f = curFacility();
  const days = daysInMonth(f.year, f.month);
  const wb = XLSX.utils.book_new();

  // シフトパターン
  const pData = [['コード','シフト名','開始','終了','休憩','実働(h)','備考']];
  f.patterns.forEach(p => pData.push([p.code, p.name, p.start, p.end, p.breakTime, p.hours, p.note]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(pData), 'シフトパターン');

  // 各単位ごとに1シート
  for (const u of f.units) {
    const main = [];
    main.push([`【${f.info.name}】 ${u} 勤務形態一覧表 ${f.year}年${f.month}月`]);
    main.push([]);
    const hdr = ['No.','職種','雇用形態','氏名'];
    for (let d = 1; d <= days; d++) {
      hdr.push(`${d}\n${DAY_LABELS[getDayOfWeek(f.year, f.month, d)]}`);
    }
    hdr.push('月合計(h)','月平均(h/週)','常勤換算(月/160h)','備考');
    main.push(hdr);

    const unitData = f.data[u];
    unitData.staff.forEach((s, i) => {
      const row = [i+1, s.jobTitle, s.employmentType, s.name];
      const k = `${f.year}-${String(f.month).padStart(2,'0')}`;
      let total = 0;
      for (let d = 1; d <= days; d++) {
        const code = (unitData.schedule[k] && unitData.schedule[k][i] && unitData.schedule[k][i][d]) || '';
        row.push(code);
        const p = f.patterns.find(pp => pp.code === code);
        if (p) total += p.hours;
      }
      row.push(total, total/4, total/160, s.note);
      main.push(row);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(main), u);
  }
  const fname = `${f.info.name.replace(/[／\/]/g,'_')}_勤務形態${f.year}年${f.month}月.xlsx`;
  XLSX.writeFile(wb, fname);
};

window.exportJson = function() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `勤務形態データ_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
};

window.importJson = function(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const obj = JSON.parse(e.target.result);
      if (!confirm('JSONファイルからデータを取り込みます。よろしいですか？')) return;

      if (obj.facilities) {
        // 新形式
        state.facilities = obj.facilities;
        for (const fid of Object.keys(state.facilities)) {
          await saveFacility(fid);
        }
      } else if (obj.units && (obj.units['午前の部'] || obj.units['午後の部'])) {
        // 旧形式（単位構造あり）→ 安積店に取り込み
        state.facilities['asaka'] = {
          info: FACILITIES.find(f => f.id === 'asaka').info,
          patterns: obj.patterns || JSON.parse(JSON.stringify(DEFAULT_PATTERNS)),
          units: ['午前の部', '午後の部'],
          currentUnit: obj.currentUnit || '午前の部',
          year: obj.year || 2026,
          month: obj.month || 6,
          data: obj.units,
          updatedAt: 0,
        };
        await saveFacility('asaka');
      } else if (obj.staff) {
        // 最古形式（staff/schedule直下）→ 安積店の午前の部に取り込み
        const fdata = makeDefaultFacilityState(FACILITIES.find(f => f.id === 'asaka'));
        fdata.patterns = obj.patterns || fdata.patterns;
        fdata.year = obj.year || fdata.year;
        fdata.month = obj.month || fdata.month;
        fdata.data['午前の部'] = { staff: obj.staff, schedule: obj.schedule || {} };
        state.facilities['asaka'] = fdata;
        await saveFacility('asaka');
      } else {
        alert('JSON形式が認識できません。');
        return;
      }
      renderAll();
      alert('読み込み完了');
    } catch(e) { alert('読み込み失敗: ' + e.message); }
  };
  reader.readAsText(file);
  event.target.value = '';
};

// ===== 起動 =====
checkSessionAuth();
</script>
