<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>勤務形態一覧表｜poem de riha 安積店</title>
  <meta name="description" content="勤務形態一覧表（シフト管理）。シフトパターンを登録し、ドロップダウンで選択するだけで月合計・常勤換算が自動計算されます。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --ink: #1f2933;
      --ink-soft: #3a414d;
      --ink-mute: #5d6068;
      --gold: #a87827;
      --gold-soft: #d6b072;
      --gold-pale: #f4ead6;
      --paper: #fbf9f4;
      --line: #e3dccc;
      --line-soft: #f0eadb;
      --weekend: #fff4ec;
      --week1: #fbf9f4;
      --week2: #ffffff;
    }

    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', sans-serif;
      color: var(--ink);
      background: var(--paper);
      line-height: 1.6;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      padding: 0 0 60px;
    }

    /* topbar */
    .topbar {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 14px 20px;
      position: sticky; top: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .topbar .crumb {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      letter-spacing: 0.15em;
      color: var(--ink-soft);
      text-transform: uppercase;
    }
    .topbar a, .topbar button {
      color: var(--ink-soft);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      background: transparent;
      border: 1px solid var(--line);
      padding: 6px 14px;
      border-radius: 22px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .topbar button.primary {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }
    .topbar button:hover {
      background: var(--ink); color: #fff; border-color: var(--ink);
    }

    .container { max-width: 1600px; margin: 0 auto; padding: 24px 16px; }

    /* タイトル */
    .doc-head {
      text-align: center;
      padding: 16px 0 24px;
    }
    .doc-eyebrow {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11pt;
      letter-spacing: 0.4em;
      color: var(--gold);
      margin-bottom: 6px;
    }
    .doc-title {
      font-family: 'Noto Serif JP', serif;
      font-size: 24px;
      font-weight: 600;
      color: var(--ink);
    }

    /* 事業所情報 */
    .facility-info {
      background: #fff;
      border: 1px solid var(--line);
      padding: 18px 22px;
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 24px;
      font-size: 13px;
    }
    .facility-info .row { display: flex; gap: 8px; }
    .facility-info .lbl {
      color: var(--gold); font-weight: 600; min-width: 110px;
      font-family: 'Noto Serif JP', serif;
    }

    /* 月選択 */
    .month-selector {
      background: #fff;
      border: 1px solid var(--line);
      padding: 12px 20px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .month-selector select {
      font-family: inherit;
      font-size: 14px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      color: var(--ink);
    }
    .month-selector .label {
      font-family: 'Noto Serif JP', serif;
      font-weight: 600;
      color: var(--ink);
    }
    .month-selector button {
      background: transparent;
      border: 1px solid var(--line);
      padding: 5px 12px;
      border-radius: 18px;
      font-size: 13px;
      cursor: pointer;
      color: var(--ink-soft);
    }
    .month-selector button:hover { background: var(--ink); color: #fff; }

    /* セクション */
    .section {
      background: #fff;
      border: 1px solid var(--line);
      margin-bottom: 24px;
    }
    .section-head {
      padding: 14px 20px;
      background: var(--ink);
      color: #fff;
      display: flex; justify-content: space-between; align-items: center;
      font-family: 'Noto Serif JP', serif;
      font-size: 15px;
      font-weight: 600;
    }
    .section-head .actions { display: flex; gap: 8px; }
    .section-head .actions button {
      background: transparent;
      border: 1px solid var(--gold-soft);
      color: var(--gold-soft);
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 12px;
      cursor: pointer;
    }
    .section-head .actions button:hover { background: var(--gold); color: #fff; border-color: var(--gold); }
    .section-body { padding: 16px 20px; }

    /* シフトパターン管理 */
    details { margin-bottom: 24px; }
    summary {
      cursor: pointer; padding: 14px 20px;
      background: #fff; border: 1px solid var(--line);
      font-family: 'Noto Serif JP', serif; font-weight: 600;
      list-style: none;
      display: flex; align-items: center; gap: 8px;
    }
    summary::before {
      content: "▶"; font-size: 10px; color: var(--gold);
      transition: transform 0.2s;
    }
    details[open] summary::before { transform: rotate(90deg); }

    .pattern-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 12px;
    }
    .pattern-table th {
      background: var(--ink);
      color: #fff;
      padding: 8px;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.04em;
      text-align: center;
    }
    .pattern-table td {
      padding: 0;
      border: 1px solid var(--line-soft);
    }
    .pattern-table input {
      width: 100%;
      padding: 6px 8px;
      border: none;
      font-family: inherit;
      font-size: 13px;
      background: transparent;
      text-align: center;
    }
    .pattern-table input:focus { background: var(--gold-pale); outline: 1px solid var(--gold); }
    .pattern-table input.name { text-align: left; }
    .pattern-table input.note { text-align: left; }
    .pattern-table .del-btn {
      background: transparent; border: none;
      color: var(--ink-mute); cursor: pointer;
      font-size: 16px; padding: 4px 8px;
    }
    .pattern-table .del-btn:hover { color: #c0392b; }
    .add-row-btn {
      margin-top: 10px;
      background: transparent;
      border: 1px dashed var(--gold);
      color: var(--gold);
      padding: 6px 16px;
      cursor: pointer;
      font-size: 13px;
      border-radius: 4px;
    }
    .add-row-btn:hover { background: var(--gold-pale); }

    /* シフト一覧表 */
    .shift-table-wrap {
      overflow-x: auto;
      background: #fff;
      border: 1px solid var(--line);
    }
    .shift-table {
      border-collapse: collapse;
      font-size: 12px;
      min-width: 100%;
    }
    .shift-table th, .shift-table td {
      border: 1px solid var(--line-soft);
      padding: 0;
      text-align: center;
    }
    .shift-table thead th {
      background: var(--ink);
      color: #fff;
      padding: 6px 4px;
      font-weight: 600;
      font-size: 11px;
      position: sticky; top: 0; z-index: 10;
    }
    .shift-table thead .day-header {
      min-width: 38px;
      width: 38px;
    }
    .shift-table thead .day-sat { background: #2c4159; }
    .shift-table thead .day-sun { background: #5a3338; }
    .shift-table tbody td.weekend { background: var(--weekend); }
    .shift-table tbody td.week-end-divider { border-right: 2px solid var(--gold-soft); }
    .shift-table tbody td.staff-info input,
    .shift-table tbody td.staff-info select {
      width: 100%;
      padding: 6px 8px;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 12px;
    }
    .shift-table tbody td.staff-info input:focus,
    .shift-table tbody td.staff-info select:focus {
      background: var(--gold-pale); outline: 1px solid var(--gold);
    }
    .shift-table tbody td.shift-cell select {
      width: 100%;
      padding: 4px 2px;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 11px;
      text-align: center;
      text-align-last: center;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }
    .shift-table tbody td.shift-cell select:focus {
      background: var(--gold-pale); outline: 1px solid var(--gold);
    }
    .shift-table tbody td.summary {
      background: var(--gold-pale);
      font-weight: 600;
      padding: 6px 8px;
      min-width: 60px;
    }
    .shift-table tbody td.note input {
      width: 100%; padding: 6px 8px; border: none; background: transparent;
      font-family: inherit; font-size: 12px;
    }
    .shift-table .row-num { color: var(--ink-mute); width: 30px; padding: 6px; }
    .shift-table .del-row-btn {
      background: transparent; border: none;
      color: var(--ink-mute); cursor: pointer; font-size: 14px;
    }
    .shift-table .del-row-btn:hover { color: #c0392b; }

    .shift-table tfoot td {
      background: var(--gold-pale);
      font-weight: 700;
      padding: 6px 4px;
      font-size: 11px;
      color: var(--ink);
    }

    /* フィックス職員列 */
    .col-no, .col-job, .col-emp, .col-name { background: #fff; }

    /* バックアップ系 */
    .actions-bar {
      display: flex; gap: 10px; flex-wrap: wrap;
      padding: 16px 20px;
      background: var(--gold-pale);
      border: 1px solid var(--gold-soft);
      margin-top: 24px;
    }
    .actions-bar button {
      background: var(--ink); color: #fff;
      border: none; padding: 8px 18px;
      border-radius: 22px; font-size: 13px; cursor: pointer;
      font-weight: 500;
    }
    .actions-bar button.secondary {
      background: #fff; color: var(--ink); border: 1px solid var(--ink);
    }
    .actions-bar button:hover { opacity: 0.85; }
    .save-status {
      margin-left: auto;
      font-size: 12px;
      color: var(--ink-soft);
      font-style: italic;
    }

    /* 印刷スタイル */
    @page { size: A3 landscape; margin: 8mm; }
    @media print {
      .topbar, .actions-bar, details, .month-selector button { display: none !important; }
      body { background: #fff; padding: 0; font-size: 9pt; }
      .container { padding: 0; max-width: 100%; }
      .doc-head { padding: 4mm 0 4mm; }
      .doc-title { font-size: 18pt; }
      .facility-info { font-size: 9pt; padding: 8px 12px; }
      .month-selector { padding: 6px 12px; font-size: 9pt; }
      .month-selector select { border: none; padding: 0; font-size: 11pt; font-weight: bold; color: var(--ink); }
      .section-head { padding: 6px 10px; font-size: 11pt; }
      .shift-table { font-size: 9pt; }
      .shift-table thead th { padding: 4px 2px; font-size: 9pt; position: static; }
      .shift-table tbody td.shift-cell select { font-size: 10pt; -webkit-appearance: none; appearance: none; }
      .shift-table tfoot td { font-size: 9pt; }
      select { background: transparent !important; }
      select::-ms-expand { display: none; }
      .del-row-btn, .del-btn, .add-row-btn { display: none !important; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <a href="https://www.hana-hiro.com/">&#x2190; ホームへ</a>
  <span class="crumb">勤務形態一覧表</span>
  <div style="display:flex;gap:8px">
    <button onclick="window.print()">PRINT / PDF</button>
    <button class="primary" onclick="exportXlsx()">Excel書き出し</button>
  </div>
</div>

<div class="container">

  <div class="doc-head">
    <div class="doc-eyebrow">SHIFT SCHEDULE</div>
    <h1 class="doc-title">勤務形態一覧表</h1>
  </div>

  <!-- 事業所情報 -->
  <div class="facility-info">
    <div class="row"><span class="lbl">事業所名</span><span>poem de riha 安積店</span></div>
    <div class="row"><span class="lbl">サービス種別</span><span>地域密着型通所介護（3〜4時間）／介護予防・日常生活支援総合事業</span></div>
    <div class="row"><span class="lbl">所在地</span><span>福島県郡山市安積町笹川字四角担3-1</span></div>
    <div class="row"><span class="lbl">提供時間</span><span>午前 9:00〜12:05 ／ 午後 13:25〜16:30</span></div>
    <div class="row"><span class="lbl">営業日</span><span>月〜金（祝日も営業）／ 休：土日・年末年始</span></div>
    <div class="row"><span class="lbl">利用定員</span><span>1日 18名</span></div>
  </div>

  <!-- 月選択 -->
  <div class="month-selector">
    <span class="label">基準年月：</span>
    <select id="year"></select>
    <span>年</span>
    <select id="month"></select>
    <span>月</span>
    <button onclick="changeMonth(-1)">＜ 先月</button>
    <button onclick="changeMonth(1)">来月 ＞</button>
    <span style="margin-left:auto;font-size:12px;color:var(--ink-mute)" id="day-info"></span>
  </div>

  <!-- シフトパターン管理 -->
  <details>
    <summary>シフトパターン管理（クリックで開閉）</summary>
    <div style="padding:0 16px 16px;background:#fff;border:1px solid var(--line);border-top:none">
      <table class="pattern-table">
        <thead>
          <tr>
            <th style="width:60px">コード</th>
            <th>シフト名</th>
            <th style="width:80px">開始</th>
            <th style="width:80px">終了</th>
            <th style="width:60px">休憩</th>
            <th style="width:80px">実働(h)</th>
            <th>備考</th>
            <th style="width:40px"></th>
          </tr>
        </thead>
        <tbody id="pattern-tbody"></tbody>
      </table>
      <button class="add-row-btn" onclick="addPattern()">+ シフトパターンを追加</button>
    </div>
  </details>

  <!-- シフト一覧表 -->
  <div class="section">
    <div class="section-head">
      <span>勤務形態一覧</span>
      <div class="actions">
        <button onclick="addStaff()">+ 職員追加</button>
      </div>
    </div>
    <div class="shift-table-wrap">
      <table class="shift-table" id="shift-table">
        <thead id="shift-thead"></thead>
        <tbody id="shift-tbody"></tbody>
        <tfoot id="shift-tfoot"></tfoot>
      </table>
    </div>
  </div>

  <!-- バックアップ -->
  <div class="actions-bar">
    <button onclick="exportXlsx()">📊 Excelで書き出し</button>
    <button class="secondary" onclick="exportJson()">💾 バックアップ(JSON)</button>
    <button class="secondary" onclick="document.getElementById('json-import').click()">📥 JSON読み込み</button>
    <input type="file" id="json-import" accept=".json" style="display:none" onchange="importJson(event)">
    <button class="secondary" onclick="resetAll()">🔄 全データリセット</button>
    <span class="save-status" id="save-status">─</span>
  </div>

</div>

<script>
'use strict';

// ===== データ構造 =====
const STORAGE_KEY = 'hanahiro-shift-schedule';

const DEFAULT_PATTERNS = [
  { code: '早',  name: '早番',          start: '7:30',  end: '16:30', breakTime: '1:00', hours: 8.0,  note: '' },
  { code: '日',  name: '日勤',          start: '9:00',  end: '18:00', breakTime: '1:00', hours: 8.0,  note: '' },
  { code: '遅',  name: '遅番',          start: '11:00', end: '20:00', breakTime: '1:00', hours: 8.0,  note: '' },
  { code: 'A',   name: '午前の部担当',   start: '8:30',  end: '13:00', breakTime: '',     hours: 4.5,  note: 'poem de riha 想定' },
  { code: 'B',   name: '午後の部担当',   start: '13:00', end: '17:00', breakTime: '',     hours: 4.0,  note: 'poem de riha 想定' },
  { code: '通',  name: '通し勤務',      start: '8:30',  end: '17:30', breakTime: '1:00', hours: 8.0,  note: '' },
  { code: '半早', name: '半日早番',     start: '8:30',  end: '13:00', breakTime: '',     hours: 4.5,  note: '' },
  { code: '半遅', name: '半日遅番',     start: '13:00', end: '17:30', breakTime: '',     hours: 4.5,  note: '' },
  { code: '夜',   name: '夜勤',         start: '17:00', end: '翌9:00', breakTime: '2:00', hours: 14.0, note: '' },
  { code: '短',   name: '短時間',       start: '9:00',  end: '13:00', breakTime: '',     hours: 4.0,  note: '' },
  { code: '有',   name: '有給休暇',     start: '',      end: '',      breakTime: '',     hours: 8.0,  note: '所定労働時間で計上' },
  { code: '特',   name: '特別休暇',     start: '',      end: '',      breakTime: '',     hours: 0.0,  note: '' },
  { code: '公',   name: '公休（休日）', start: '',      end: '',      breakTime: '',     hours: 0.0,  note: '' },
  { code: '休',   name: '休み',         start: '',      end: '',      breakTime: '',     hours: 0.0,  note: '' },
];

const DEFAULT_STAFF = [
  { jobTitle: '管理者',         employmentType: '常勤専従', name: '', note: '' },
  { jobTitle: '生活相談員',      employmentType: '常勤専従', name: '', note: '' },
  { jobTitle: '看護職員',        employmentType: '常勤専従', name: '', note: '' },
  { jobTitle: '機能訓練指導員',  employmentType: '常勤専従', name: '', note: '柔道整復師' },
  { jobTitle: '介護職員',        employmentType: '常勤専従', name: '', note: '' },
  { jobTitle: '介護職員',        employmentType: '常勤専従', name: '', note: '' },
  { jobTitle: '介護職員',        employmentType: '非常勤専従', name: '', note: '' },
  { jobTitle: '介護職員',        employmentType: '非常勤専従', name: '', note: '' },
];

let state = {
  year: 2026,
  month: 6,
  patterns: JSON.parse(JSON.stringify(DEFAULT_PATTERNS)),
  staff: JSON.parse(JSON.stringify(DEFAULT_STAFF)),
  // schedule[year-month][staffIndex][day] = code
  schedule: {},
};

// ===== 永続化 =====
function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    updateSaveStatus('保存済み: ' + new Date().toLocaleString('ja-JP'));
  } catch(e) {
    updateSaveStatus('保存失敗: ' + e.message);
  }
}
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const obj = JSON.parse(raw);
      state = Object.assign(state, obj);
    }
  } catch(e) { console.error(e); }
}
function updateSaveStatus(msg) {
  document.getElementById('save-status').textContent = msg;
}

// ===== 月キー =====
function monthKey() { return `${state.year}-${String(state.month).padStart(2,'0')}`; }
function getSchedule(staffIdx, day) {
  const k = monthKey();
  return (state.schedule[k] && state.schedule[k][staffIdx] && state.schedule[k][staffIdx][day]) || '';
}
function setSchedule(staffIdx, day, value) {
  const k = monthKey();
  if (!state.schedule[k]) state.schedule[k] = {};
  if (!state.schedule[k][staffIdx]) state.schedule[k][staffIdx] = {};
  state.schedule[k][staffIdx][day] = value;
}

// ===== カレンダー計算 =====
function daysInMonth(y, m) {
  return new Date(y, m, 0).getDate();
}
function getDayOfWeek(y, m, d) {
  return new Date(y, m - 1, d).getDay(); // 0=日, 6=土
}
const DAY_LABELS = ['日','月','火','水','木','金','土'];

// ===== 月選択 =====
function buildMonthSelector() {
  const yearSel = document.getElementById('year');
  const monthSel = document.getElementById('month');
  const currentYear = new Date().getFullYear();
  yearSel.innerHTML = '';
  for (let y = currentYear - 1; y <= currentYear + 3; y++) {
    const opt = document.createElement('option');
    opt.value = y; opt.textContent = y;
    yearSel.appendChild(opt);
  }
  yearSel.value = state.year;
  monthSel.innerHTML = '';
  for (let m = 1; m <= 12; m++) {
    const opt = document.createElement('option');
    opt.value = m; opt.textContent = m;
    monthSel.appendChild(opt);
  }
  monthSel.value = state.month;

  yearSel.addEventListener('change', () => { state.year = parseInt(yearSel.value); save(); render(); });
  monthSel.addEventListener('change', () => { state.month = parseInt(monthSel.value); save(); render(); });
}
function changeMonth(delta) {
  state.month += delta;
  if (state.month > 12) { state.month = 1; state.year += 1; }
  if (state.month < 1) { state.month = 12; state.year -= 1; }
  document.getElementById('year').value = state.year;
  document.getElementById('month').value = state.month;
  save(); render();
}

// ===== シフトパターン =====
function renderPatterns() {
  const tbody = document.getElementById('pattern-tbody');
  tbody.innerHTML = '';
  state.patterns.forEach((p, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input value="${escape(p.code)}" oninput="updatePattern(${i}, 'code', this.value)"></td>
      <td><input class="name" value="${escape(p.name)}" oninput="updatePattern(${i}, 'name', this.value)"></td>
      <td><input value="${escape(p.start)}" oninput="updatePattern(${i}, 'start', this.value)"></td>
      <td><input value="${escape(p.end)}" oninput="updatePattern(${i}, 'end', this.value)"></td>
      <td><input value="${escape(p.breakTime)}" oninput="updatePattern(${i}, 'breakTime', this.value)"></td>
      <td><input type="number" step="0.1" value="${p.hours}" oninput="updatePattern(${i}, 'hours', parseFloat(this.value)||0)"></td>
      <td><input class="note" value="${escape(p.note)}" oninput="updatePattern(${i}, 'note', this.value)"></td>
      <td><button class="del-btn" onclick="removePattern(${i})" title="削除">×</button></td>
    `;
    tbody.appendChild(tr);
  });
}
function updatePattern(i, key, value) {
  state.patterns[i][key] = value;
  save();
  renderShiftTable();  // dropdown更新のため
}
function addPattern() {
  state.patterns.push({ code: '', name: '', start: '', end: '', breakTime: '', hours: 0, note: '' });
  save(); renderPatterns(); renderShiftTable();
}
function removePattern(i) {
  if (!confirm('このシフトパターンを削除しますか？')) return;
  state.patterns.splice(i, 1);
  save(); renderPatterns(); renderShiftTable();
}

// ===== シフト一覧表 =====
function buildShiftHead(days) {
  const thead = document.getElementById('shift-thead');
  let h1 = '<tr>';
  // 固定情報
  h1 += '<th rowspan="2" style="min-width:30px">No.</th>';
  h1 += '<th rowspan="2" style="min-width:100px">職種</th>';
  h1 += '<th rowspan="2" style="min-width:90px">雇用形態</th>';
  h1 += '<th rowspan="2" style="min-width:120px">氏名</th>';
  // 日付（4週グループ）
  let weekStart = 1;
  while (weekStart <= days) {
    const weekEnd = Math.min(weekStart + 6, days);
    const span = weekEnd - weekStart + 1;
    h1 += `<th colspan="${span}" style="background:var(--gold)">${Math.floor(weekStart/7)+1}週目 (${weekStart}日〜${weekEnd}日)</th>`;
    weekStart = weekEnd + 1;
  }
  h1 += '<th rowspan="2" style="min-width:60px">月合計<br>(h)</th>';
  h1 += '<th rowspan="2" style="min-width:60px">月平均<br>(h/週)</th>';
  h1 += '<th rowspan="2" style="min-width:70px">常勤換算<br>(月/160h)</th>';
  h1 += '<th rowspan="2" style="min-width:90px">備考</th>';
  h1 += '<th rowspan="2" style="min-width:30px"></th>';
  h1 += '</tr>';

  let h2 = '<tr>';
  for (let d = 1; d <= days; d++) {
    const dow = getDayOfWeek(state.year, state.month, d);
    let dayClass = 'day-header';
    if (dow === 6) dayClass += ' day-sat';
    if (dow === 0) dayClass += ' day-sun';
    h2 += `<th class="${dayClass}">${d}<br><small>${DAY_LABELS[dow]}</small></th>`;
  }
  h2 += '</tr>';
  thead.innerHTML = h1 + h2;
}
function buildShiftTbody(days) {
  const tbody = document.getElementById('shift-tbody');
  tbody.innerHTML = '';

  const optionsHtml = '<option value=""></option>' +
    state.patterns.map(p => `<option value="${escape(p.code)}">${escape(p.code)}</option>`).join('');

  state.staff.forEach((s, i) => {
    const tr = document.createElement('tr');
    let html = '';
    html += `<td class="row-num">${i+1}</td>`;
    html += `<td class="staff-info col-job"><input value="${escape(s.jobTitle)}" oninput="updateStaff(${i},'jobTitle',this.value)"></td>`;
    html += `<td class="staff-info col-emp"><input value="${escape(s.employmentType)}" oninput="updateStaff(${i},'employmentType',this.value)"></td>`;
    html += `<td class="staff-info col-name"><input value="${escape(s.name)}" oninput="updateStaff(${i},'name',this.value)"></td>`;

    let weekTotal = 0;
    for (let d = 1; d <= days; d++) {
      const dow = getDayOfWeek(state.year, state.month, d);
      const isWeekEndCol = (d % 7 === 0 && d < days);
      const cls = ['shift-cell'];
      if (dow === 6 || dow === 0) cls.push('weekend');
      if (isWeekEndCol) cls.push('week-end-divider');
      const value = getSchedule(i, d);
      html += `<td class="${cls.join(' ')}">
        <select onchange="setShiftCell(${i},${d},this.value)">${optionsHtml.replace(`value="${escape(value)}"`, `value="${escape(value)}" selected`)}</select>
      </td>`;
    }

    const total = calcMonthTotal(i, days);
    const weekly = total / 4;
    const fte = total / 160;
    html += `<td class="summary">${total.toFixed(1)}</td>`;
    html += `<td class="summary">${weekly.toFixed(1)}</td>`;
    html += `<td class="summary">${fte.toFixed(2)}</td>`;
    html += `<td class="note"><input value="${escape(s.note)}" oninput="updateStaff(${i},'note',this.value)"></td>`;
    html += `<td><button class="del-row-btn" onclick="removeStaff(${i})" title="削除">×</button></td>`;

    tr.innerHTML = html;
    tbody.appendChild(tr);
  });
}
function buildShiftTfoot(days) {
  const tfoot = document.getElementById('shift-tfoot');
  let html = '<tr>';
  html += '<td colspan="4" style="text-align:right;padding-right:10px">合計</td>';

  // 各日の合計
  for (let d = 1; d <= days; d++) {
    let dayTotal = 0;
    state.staff.forEach((_, i) => {
      const code = getSchedule(i, d);
      const p = state.patterns.find(p => p.code === code);
      if (p) dayTotal += p.hours;
    });
    html += `<td>${dayTotal > 0 ? dayTotal.toFixed(1) : '-'}</td>`;
  }

  // 月合計の総合計
  let grandTotal = 0;
  state.staff.forEach((_, i) => grandTotal += calcMonthTotal(i, days));
  html += `<td>${grandTotal.toFixed(1)}</td>`;
  html += `<td>${(grandTotal/4).toFixed(1)}</td>`;
  html += `<td>${(grandTotal/160).toFixed(2)}</td>`;
  html += '<td colspan="2"></td>';
  html += '</tr>';
  tfoot.innerHTML = html;
}
function calcMonthTotal(staffIdx, days) {
  let total = 0;
  for (let d = 1; d <= days; d++) {
    const code = getSchedule(staffIdx, d);
    const p = state.patterns.find(p => p.code === code);
    if (p) total += p.hours;
  }
  return total;
}
function setShiftCell(staffIdx, day, code) {
  setSchedule(staffIdx, day, code);
  save();
  renderShiftTable(); // 再計算
}
function updateStaff(i, key, value) {
  state.staff[i][key] = value;
  save();
}
function addStaff() {
  state.staff.push({ jobTitle: '', employmentType: '', name: '', note: '' });
  save(); renderShiftTable();
}
function removeStaff(i) {
  if (!confirm('この職員を削除しますか？\n（その職員の月のシフトデータも削除されます）')) return;
  state.staff.splice(i, 1);
  // schedule 内のその職員データもクリア
  Object.keys(state.schedule).forEach(k => {
    if (state.schedule[k][i]) delete state.schedule[k][i];
  });
  save(); renderShiftTable();
}

function renderShiftTable() {
  const days = daysInMonth(state.year, state.month);
  buildShiftHead(days);
  buildShiftTbody(days);
  buildShiftTfoot(days);
  document.getElementById('day-info').textContent = `${days}日 / 1日(月初) ${DAY_LABELS[getDayOfWeek(state.year, state.month, 1)]}曜`;
}

function render() {
  renderPatterns();
  renderShiftTable();
}

// ===== Excel書き出し =====
function exportXlsx() {
  const days = daysInMonth(state.year, state.month);
  const wb = XLSX.utils.book_new();

  // シート1: シフトパターン
  const patternData = [['コード', 'シフト名', '開始', '終了', '休憩', '実働(h)', '備考']];
  state.patterns.forEach(p => {
    patternData.push([p.code, p.name, p.start, p.end, p.breakTime, p.hours, p.note]);
  });
  const wsPattern = XLSX.utils.aoa_to_sheet(patternData);
  XLSX.utils.book_append_sheet(wb, wsPattern, 'シフトパターン');

  // シート2: 勤務形態一覧表
  const main = [];
  // ヘッダー
  const dayHeader = ['No.', '職種', '雇用形態', '氏名'];
  for (let d = 1; d <= days; d++) {
    dayHeader.push(`${d}\n${DAY_LABELS[getDayOfWeek(state.year, state.month, d)]}`);
  }
  dayHeader.push('月合計(h)', '月平均(h/週)', '常勤換算(月/160h)', '備考');
  main.push(dayHeader);

  state.staff.forEach((s, i) => {
    const row = [i+1, s.jobTitle, s.employmentType, s.name];
    for (let d = 1; d <= days; d++) {
      row.push(getSchedule(i, d));
    }
    const total = calcMonthTotal(i, days);
    row.push(total, total/4, total/160, s.note);
    main.push(row);
  });
  const wsMain = XLSX.utils.aoa_to_sheet(main);
  XLSX.utils.book_append_sheet(wb, wsMain, `勤務形態${state.year}年${state.month}月`);

  XLSX.writeFile(wb, `勤務形態一覧表_${state.year}年${state.month}月.xlsx`);
}

// ===== JSON =====
function exportJson() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `勤務形態データ_${monthKey()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}
function importJson(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const obj = JSON.parse(e.target.result);
      if (!confirm('現在のデータを上書きしますか？\nこの操作は取り消せません。')) return;
      state = Object.assign(state, obj);
      save(); render();
      alert('読み込み完了');
    } catch(e) { alert('読み込み失敗: ' + e.message); }
  };
  reader.readAsText(file);
  event.target.value = '';
}
function resetAll() {
  if (!confirm('すべてのデータをリセットして、初期状態に戻します。\n本当によろしいですか？')) return;
  state = {
    year: new Date().getFullYear(),
    month: new Date().getMonth() + 1,
    patterns: JSON.parse(JSON.stringify(DEFAULT_PATTERNS)),
    staff: JSON.parse(JSON.stringify(DEFAULT_STAFF)),
    schedule: {},
  };
  document.getElementById('year').value = state.year;
  document.getElementById('month').value = state.month;
  save(); render();
}

// ===== ユーティリティ =====
function escape(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ===== 起動 =====
window.addEventListener('DOMContentLoaded', () => {
  load();
  buildMonthSelector();
  render();
});

</script>
